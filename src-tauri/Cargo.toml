[package]
name = "capi-studio-v2"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "capi_studio_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Onda 11.A — necessário para `db_tx_execute`, comando custom que executa
# múltiplas queries atomicamente reusando o pool do tauri-plugin-sql via
# DbInstances público (PR #1381). Já é dep transitiva do plugin-sql; declarar
# direto permite nomear `SqlitePool` e `Transaction` no nosso código.
# Ver ADR 017.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# Onda 11.security — consolidação: features de prod + features de teste numa
# linha só, ativadas para `#[tokio::test]` em db_tx.rs sem precisar de uma
# segunda declaração em [dev-dependencies]. Custo zero em runtime (cargo só
# inclui o que é usado pelo grafo de dependências final).
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread"] }

